name: PHP CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t php-app .

      - name: Test application
        run: |
          docker run -d --name test-app -p 8080:80 php-app
          sleep 5
          curl http://localhost:8080
          docker stop test-app
          docker rm test-app

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: ./deploy.sh